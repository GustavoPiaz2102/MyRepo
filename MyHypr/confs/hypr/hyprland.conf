env = XDG_DATA_DIRS,/home/gustavo/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher
$nav = google-chrome-stable
$wallpaperbnd = /tmp/qs-wallpaper-toggle

# Autostart
hyprctl keyword "hl.layer_rule({ match = { namespace = 'bar-0' }, on_demand_exclusive = false })"
exec-once = awww-daemon
#exec-once = quickshell
exec-once = /usr/bin/tide-island

# Apps
bind = $mainMod, Q, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = CTRL ALT, E, exec, $nav
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, touch $wallpaperbnd
bind = , Print, exec, grimblast copy area
bind = $mainMod SHIFT, S, exec, grimblast copy area

# Window management
bind = ALT, F4, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = SUPER, P, movewindow, mon:Virtual-1
bind = SUPER, O, movewindow, mon:HDMI-A-1

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = ALT, tab, workspace, e+1
bind = ALT SHIFT, tab, workspace, e-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = ALT, W, exec, wtype ?
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
}
decoration {
    rounding = 18
}
input {
    kb_layout = br
}

# Generated binds are stored in ~/.config/tide-island/hyprland-shortcuts.conf.
# They call Quickshell IPC and can also be reused from your own scripts.
source = /home/gustavo/.config/tide-island/hyprland-shortcuts.conf
